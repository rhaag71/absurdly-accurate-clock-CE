[platformio]
default_envs = pico2

[env]
; Shared RP2350 / Arduino-Pico environment; profiles vary only by compile-time
; application configuration and keep the same framework and dependencies.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags = -DAAC_DISPLAY_BACKEND_PD2200

[env:pico2]
build_flags = ${env.build_flags} -DAAC_BUILD_PROFILE_PRODUCTION

[env:pico2-dev]
build_flags = ${env.build_flags} -DAAC_BUILD_PROFILE_DEVELOPMENT
